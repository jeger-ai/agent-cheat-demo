name: ci
on: [push, pull_request]
jobs:
  demo:
    # Runs the demo against the published @jeger-ai/opengantry and checks that cage restored every tamper.
    # npm test is red on purpose (the bug in src/price.js), so it is not a CI step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: cage restores what the simulated agent tampers with
        run: ./ci-check.sh
  boundary:
    # A plan worker leaves its file lists (jeger-ai/opengantry#301): the cage puts its writes back, verify fails its
    # commit. Runs against the published @jeger-ai/opengantry-cage, -verify and opengantry (gantry adapt) 4.x.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: cage and verify keep the worker inside the plan
        run: ./ci-check-boundary.sh
      - name: the plain-language story still matches the tools' output
        run: |
          STORY_PAUSE=0 ./story.sh | sed 's/\x1b\[[0-9;]*m//g' | tee story.out
          grep -q '8 changes outside the plan, put back automatically' story.out
          grep -q 'kept: src/format-greeting.js src/format-greeting.test.js' story.out
          grep -q '8 files outside the plan' story.out
          grep -q 'commit blocked (exit 1)' story.out
